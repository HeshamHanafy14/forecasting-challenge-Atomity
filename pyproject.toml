[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Forecasting aggregate CPU demand on an Azure VM trace"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analysis = ["matplotlib>=3.8", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
